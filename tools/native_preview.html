<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi dashboard · simulated browser preview</title>
<style>
:root{--primary-color:#008cff;--primary-text-color:#172033;--secondary-text-color:#657386;--divider-color:#dce3eb;--ha-card-background:#fff;--secondary-background-color:#f3f6fa;--ha-card-border-radius:12px;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font:15px/1.5 system-ui,sans-serif}aside{position:fixed;inset:0 auto 0 0;width:240px;background:#f7f9fc;border-right:1px solid #dce3eb;padding:24px 12px}aside strong{font-size:20px;display:block;margin-bottom:34px;padding:0 10px}aside div{padding:15px 20px;margin-bottom:8px;border-radius:10px}aside .selected{background:#dfedff;color:#008cff;font-weight:600}main{margin-left:240px;padding:24px 26px 40px;max-width:1800px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}h1{font-size:32px;margin:0;letter-spacing:-.6px}header p{margin:0;color:#657386}button{font:inherit;border:1px solid #c5ddff;background:white;color:#008cff;border-radius:8px;padding:10px 16px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}.grid>*{min-width:0}.section{display:grid;grid-template-columns:repeat(var(--section-columns,12),minmax(0,1fr));gap:8px;align-items:start}.section>*{min-width:0}.span-3{grid-column:1/-1}.span-2{grid-column:span 2}.preview-label{font-size:12px;color:#657386;margin-top:18px}#editor{margin-top:18px;border:1px solid #dce3eb;padding:20px;border-radius:12px;background:white}[hidden]{display:none!important}@media(max-width:850px){aside{display:none}main{margin-left:0;padding:16px}.grid{grid-template-columns:1fr}.span-2,.span-3{grid-column:auto}.section{--section-columns:12!important}h1{font-size:25px}header{align-items:flex-start}header>button{white-space:nowrap;font-size:12px}}
</style></head><body><aside><strong>⌂ Home Assistant</strong><div>Overview</div><div>Calendar</div><div>Energy</div><div class="selected">⏻ Pi Wake &amp; Sleep</div><div>Settings</div></aside><main><header><div><h1>Pi Wake &amp; Sleep</h1><p>Your Pi, on your schedule.</p></div><button id="edit">Edit dashboard</button></header><div id="cards" class="grid"></div><section id="editor" hidden><h2>Visual Pi card editor</h2><div id="editor-content"></div><button id="close-editor">Done</button></section><p class="preview-label">SIMULATED BROWSER PREVIEW · No real Pi, UPS, phone, or power operation. Native editing is supplied by Home Assistant in production.</p></main>
<script type="module">
import '/native-cards.js';
class Icon extends HTMLElement { static get observedAttributes(){return ['icon'];} connectedCallback(){this.render();} attributeChangedCallback(){this.render();} render(){const name=(this.getAttribute('icon')||'').replace('mdi:','');const paths={power:'M12 2v10M5 5a9 9 0 1 0 14 0',calendar:'M4 5h16v16H4zM8 2v6M16 2v6M4 10h16','weather-night':'M20 15a9 9 0 0 1-11-11A9 9 0 1 0 20 15','white-balance-sunny':'M12 2v2M12 20v2M2 12h2M20 12h2M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2M16 12a4 4 0 1 0-8 0a4 4 0 0 0 8 0',battery:'M2 6h18v12H2zM20 10h2v4h-2M5 9h12v6H5z',cellphone:'M7 2h10v20H7zM11 19h2','message-text-outline':'M3 4h18v14H8l-5 4zM7 9h10M7 13h7','check-circle':'M8 12l3 3l5-6M22 12a10 10 0 1 0-20 0a10 10 0 0 0 20 0',restart:'M4 10a8 8 0 1 1 0 4M4 3v7h7','timer-outline':'M12 8v5l3 2M20 12a8 8 0 1 0-16 0a8 8 0 0 0 16 0'};this.innerHTML='<svg aria-hidden="true" viewBox="0 0 24 24" style="width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);display:block"><path d="'+(paths[name]||paths.power)+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';}}
customElements.define('ha-icon',Icon);
const hass={connection:{},user:{is_admin:true},locale:{language:'en-US'},panels:{app:{}},async callWS(message){const response=await fetch('/demo/ha-ws',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(message)});const data=await response.json();if(!response.ok)throw new Error(data.message);return data;}};
window.previewHass=hass;
const legacy=new URLSearchParams(location.search).get('layout')==='legacy';
function makeCard(config,parent){
  const kind=config.type.match(/^custom:pi-wake-(.+)-card$/)[1];
  const card=document.createElement(config.type.slice(7));card.dataset.kind=kind;
  card.setConfig(config);card.hass=hass;parent.append(card);return card;
}
if(legacy){
  for(const kind of ['setup','status','shutdown','wake','calendar','ups','controls','devices','messages','assist','activity']){
    const card=makeCard({type:'custom:pi-wake-'+kind+'-card',entry_id:'demo-entry'},document.querySelector('#cards'));
    card.className=['setup','activity'].includes(kind)?'span-3':['calendar','devices'].includes(kind)?'span-2':'';
  }
}else{
  // Model both native grid levels from the generated configuration. A wide
  // section has span * 12 columns; a 12-column card does not fill that section.
  const config=await (await fetch('/demo/dashboard-config')).json();
  for(const sectionConfig of config.views[0].sections){
    const span=sectionConfig.column_span||1,section=document.createElement('div');
    section.className='section span-'+span;section.dataset.span=span;
    section.style.setProperty('--section-columns',span*12);document.querySelector('#cards').append(section);
    for(const config of sectionConfig.cards){
      const card=makeCard(config,section),columns=config.grid_options?.columns??card.getGridOptions().columns;
      card.style.gridColumn=columns==='full'?'1 / -1':'span '+columns;
    }
  }
}
document.querySelector('#edit').onclick=()=>{const card=document.querySelector('[data-kind="summary"]')||document.querySelector('[data-kind="status"]');const editor=card.constructor.getConfigElement();editor.setConfig(card.config);editor.hass=hass;editor.addEventListener('config-changed',event=>card.setConfig(event.detail.config));document.querySelector('#editor-content').replaceChildren(editor);document.querySelector('#editor').hidden=false;};
document.querySelector('#close-editor').onclick=()=>document.querySelector('#editor').hidden=true;
</script></body></html>
