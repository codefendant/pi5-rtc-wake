name: Verify and build Pi Wake & Sleep
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the versioned preview image after all checks pass (main only)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - name: Check JavaScript
        run: node --check pi5_rtc_wake/web/app.js
      - name: Check UI interactions
        run: node tests/ui_logic.cjs
      - name: Check RTC ABI
        run: |
          gcc -Wall -Wextra -Werror tools/check_rtc_abi.c -o /tmp/rtc-abi
          /tmp/rtc-abi
  ui:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui_smoke.cjs
  image:
    needs: [verify, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Image metadata
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_REQUEST: ${{ inputs.publish && 'true' || 'false' }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          config = Path('pi5_rtc_wake/config.yaml').read_text()
          version = re.search(r'^version: "([^"]+)"$', config, re.M).group(1)
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.]+)?', version):
              raise SystemExit('The app version must be a valid release version.')
          owner, repo = os.environ['REPOSITORY'].lower().split('/')
          image = f'ghcr.io/{owner}/{repo}-pi5-rtc-wake-aarch64'
          publish = os.environ['EVENT_NAME'] == 'push' and os.environ['REF_TYPE'] == 'tag'
          if publish:
              if os.environ['REF_NAME'] != 'v' + version:
                  raise SystemExit('The release tag must match config.yaml version.')
          if os.environ['EVENT_NAME'] == 'workflow_dispatch' and os.environ['PUBLISH_REQUEST'] == 'true':
              if os.environ['REF_TYPE'] != 'branch' or os.environ['REF_NAME'] != 'main':
                  raise SystemExit('Publish a preview from the main branch only.')
              publish = True
          if publish:
              if not re.search(r'^image: ' + re.escape(image) + r'$', config, re.M):
                  raise SystemExit('Run tools/prepare_repository.py for this repository before publishing.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'image={image}\nversion={version}\npublish={str(publish).lower()}\n')
          PY
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: steps.meta.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./pi5_rtc_wake
          platforms: linux/arm64
          push: ${{ steps.meta.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
