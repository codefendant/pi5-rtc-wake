name: Verify and build Pi Wake & Sleep
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the versioned preview image after all checks pass (main only)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - name: Check JavaScript
        run: node --check pi5_rtc_wake/web/app.js
      - name: Check UI interactions
        run: node tests/ui_logic.cjs
      - name: Check RTC ABI
        run: |
          gcc -Wall -Wextra -Werror tools/check_rtc_abi.c -o /tmp/rtc-abi
          /tmp/rtc-abi
  ui:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui_smoke.cjs
  assist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the real Home Assistant native Assist interface
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            --entrypoint python ghcr.io/home-assistant/home-assistant:2026.10.1 \
            tools/check_ha_assist.py
  image:
    needs: [verify, ui, assist]
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Image metadata
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_REQUEST: ${{ inputs.publish && 'true' || 'false' }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          config = Path('pi5_rtc_wake/config.yaml').read_text()
          version = re.search(r'^version: "([^"]+)"$', config, re.M).group(1)
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.]+)?', version):
              raise SystemExit('The app version must be a valid release version.')
          owner, repo = os.environ['REPOSITORY'].lower().split('/')
          image = f'ghcr.io/{owner}/{repo}-pi5-rtc-wake-aarch64'
          publish = os.environ['EVENT_NAME'] == 'push' and os.environ['REF_TYPE'] == 'tag'
          if publish:
              if os.environ['REF_NAME'] != 'v' + version:
                  raise SystemExit('The release tag must match config.yaml version.')
          message = os.environ.get('HEAD_MESSAGE', '').splitlines()
          if (os.environ['EVENT_NAME'] == 'push' and os.environ['REF_TYPE'] == 'branch'
                  and os.environ['REF_NAME'] == 'main' and message
                  and message[0] == '[release] ' + version):
              publish = True
          if os.environ['EVENT_NAME'] == 'workflow_dispatch' and os.environ['PUBLISH_REQUEST'] == 'true':
              if os.environ['REF_TYPE'] != 'branch' or os.environ['REF_NAME'] != 'main':
                  raise SystemExit('Publish a preview from the main branch only.')
              publish = True
          if publish:
              if not re.search(r'^image: ' + re.escape(image) + r'$', config, re.M):
                  raise SystemExit('Run tools/prepare_repository.py for this repository before publishing.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'image={image}\nversion={version}\npublish={str(publish).lower()}\n')
          PY
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: steps.meta.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./pi5_rtc_wake
          platforms: linux/arm64
          push: ${{ steps.meta.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
  public-image:
    needs: image
    if: needs.image.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-public.yaml
  release:
    needs: [image, public-image]
    if: needs.image.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Publish the verified preview release
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION: ${{ needs.image.outputs.version }}
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          repo, version, commit = (os.environ[k] for k in ('REPOSITORY', 'VERSION', 'COMMIT_SHA'))
          if not re.fullmatch(r'[A-Za-z0-9-]+/[A-Za-z0-9_.-]+', repo):
              raise SystemExit('Invalid repository.')
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9.]+', version):
              raise SystemExit('This job publishes preview versions only.')
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('Invalid release commit.')
          tag = 'v' + version
          def api(path, data=None, optional=False):
              request = Request('https://api.github.com/repos/' + repo + '/' + path,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={'Authorization': 'Bearer ' + os.environ['RELEASE_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2026-03-10'})
              try:
                  with urlopen(request, timeout=30) as response:
                      return json.load(response)
              except HTTPError as error:
                  if optional and error.code == 404:
                      return None
                  raise
          def verify_tag(ref):
              obj = ref['object']
              if obj['type'] == 'tag':
                  obj = api('git/tags/' + obj['sha'])['object']
              if obj['type'] != 'commit' or obj['sha'] != commit:
                  raise SystemExit('The existing tag points to a different commit; do not move it.')
          ref = api('git/ref/tags/' + tag, optional=True)
          if ref is not None:
              verify_tag(ref)
          release = api('releases/tags/' + tag, optional=True)
          if release is None:
              release = api('releases', {'tag_name': tag, 'target_commitish': commit,
                  'name': 'Pi 5 Wake & Sleep ' + version + ' — public preview',
                  'body': Path('RELEASE_NOTES.md').read_text(), 'draft': False,
                  'prerelease': True, 'make_latest': 'false'})
          if release.get('draft') or not release.get('prerelease') or release.get('tag_name') != tag:
              raise SystemExit('The release is not the expected published preview.')
          verify_tag(api('git/ref/tags/' + tag))
          print(release['html_url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Published [' + tag + '](' + release['html_url'] + ') at `' + commit + '`.\n')
          PY
