name: Verify public installation image
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  anonymous-image:
    runs-on: ubuntu-latest
    env:
      DOCKER_CONFIG: /tmp/pi-wake-anonymous-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read installation image
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          config = Path('pi5_rtc_wake/config.yaml').read_text()
          version = re.search(r'^version: "([^"]+)"$', config, re.M).group(1)
          image = re.search(r'^image: (\S+)$', config, re.M).group(1)
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.]+)?', version):
              raise SystemExit('Invalid version.')
          if not re.fullmatch(r'ghcr\.io/[a-z0-9-]+/[a-z0-9_.-]+', image):
              raise SystemExit('Invalid public image name.')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'IMAGE={image}\nVERSION={version}\n')
          PY
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Pull without registry credentials
        run: docker pull --platform linux/arm64 "$IMAGE:$VERSION"
      - name: Check architecture and production imports
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE:$VERSION")" = arm64
          docker run --rm --platform linux/arm64 --entrypoint python3 \
            -e EXPECTED_VERSION="$VERSION" "$IMAGE:$VERSION" \
            -c 'import os, server, websocket; assert server.VERSION == os.environ["EXPECTED_VERSION"]; print("Public arm64 image and production imports verified")'
