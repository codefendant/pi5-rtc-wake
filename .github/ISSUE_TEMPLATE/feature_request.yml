name: Suggest an improvement
description: Tell us what would make Pi Wake & Sleep more useful or easier to use.
title: "[Suggestion] "
body:
  - type: textarea
    id: task
    attributes:
      label: What would you like to do?
      description: Describe your situation and the task you want to complete.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: What would make this easier?
      description: Suggest a change, or tell us which part of the current experience is confusing.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else? (optional)
      description: Add examples or screenshots. Remove any personal information before posting.
